<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request Service — CraftVerify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <div class="logo">CraftVerify</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="directory.html">Find Artisan</a>
      <a href="request.html">Request Service</a>
    </div>
  </nav>

  <section class="request-section">
    <h2>Request a Service</h2>
    <p class="subtitle">Fill in the form below and we'll connect you with a verified artisan.</p>

    <div class="request-form">
      <div class="form-group">
        <label>Your Full Name</label>
        <input type="text" placeholder="e.g. Iyiola Richard" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="e.g. 08012345678" />
      </div>
      <div class="form-group">
        <label>Service Category</label>
        <select>
          <option value="">Select a category</option>
          <option>Plumber</option>
          <option>Electrician</option>
          <option>Painter</option>
          <option>Carpenter</option>
          <option>Welder</option>
        </select>
      </div>
      <div class="form-group">
        <label>Your Zone / Address</label>
        <input type="text" placeholder="e.g. Zone 3, Redemption City" />
      </div>
      <div class="form-group">
        <label>Describe the Job</label>
        <textarea rows="4" placeholder="Briefly describe what you need done..."></textarea>
      </div>
      <button onclick="submitRequest()">Submit Request</button>
    </div>
  </section>

  <footer>
    <p>CraftVerify — Built for Redemption City © 2026</p>
  </footer>

  <script>
    function submitRequest() {
      alert('Your request has been submitted! A verified artisan will contact you shortly.');
    }
  </script>

</body>
</html>
